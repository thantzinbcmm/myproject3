# docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotel_booking_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      - db
      - redis
    networks:
      - hotel_network

  webserver:
    image: nginx:alpine
    container_name: hotel_booking_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hotel_network

  db:
    image: mysql:8.0
    container_name: hotel_booking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hotel_booking}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-hotel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotel_password}
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - hotel_network

  redis:
    image: redis:7-alpine
    container_name: hotel_booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotel_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: hotel_booking_mail
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - hotel_network

  queue_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotel_booking_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - hotel_network

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hotel_booking_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - hotel_network

networks:
  hotel_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local